name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          if git ls-remote --tags origin refs/tags/$TAG | grep -q $TAG; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$TAG" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ needs.check-version.outputs.version }}
          git push origin ${{ needs.check-version.outputs.version }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 -d > my-upload-key.jks

      - name: Build Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Generate Changelog
        run: |
          echo "### 🚀 What's New in ${{ needs.check-version.outputs.version }}" > changelog.txt
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log -n 5 --pretty=format:"* %s%n%b" | grep -v -i '^\* Bump' >> changelog.txt
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s%n%b" | grep -v -i '^\* Bump' >> changelog.txt
          fi
          echo "" >> changelog.txt
          echo "### 📦 Packages" >> changelog.txt
          echo "The updater built into the app will automatically pick the best version for your device. If downloading manually and unsure, download the **universal** APK." >> changelog.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.check-version.outputs.version }} \
            --title "Release ${{ needs.check-version.outputs.version }}" \
            --notes-file changelog.txt \
            app/build/outputs/apk/release/*.apk
