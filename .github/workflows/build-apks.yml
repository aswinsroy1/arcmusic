name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 -d > my-upload-key.jks

      - name: Build Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Generate Changelog
        run: |
          echo "### 🚀 What's New in ${{ github.ref_name }}" > changelog.txt
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log -n 5 --oneline | while read line; do echo "- $line"; done >> changelog.txt
          else
            git log ${PREV_TAG}..HEAD --oneline | while read line; do echo "- $line"; done >> changelog.txt
          fi
          echo "" >> changelog.txt
          echo "### 📦 Packages" >> changelog.txt
          echo "The updater built into the app will automatically pick the best version for your device. If downloading manually and unsure, download the **universal** APK." >> changelog.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file changelog.txt \
            app/build/outputs/apk/release/*.apk
